<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Atelier 员工快速上手</title>
  <style>
    body { font-family: Georgia, serif; max-width: 720px; margin: 40px auto; color: #1b1b1b; line-height: 1.6; }
    h1 { font-weight: 400; }
    h2 { margin-top: 28px; }
    code { background: #f3f0ea; padding: 2px 6px; }
    ol { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>Atelier 员工快速上手</h1>
  <p>把平铺图变成正面模特成品图，再下载或推到商品页。</p>
  <h2>登录</h2>
  <p>店铺后台 → 试衣工作台。账号口令由环境变量 <code>STORE_ADMIN_PASSWORD</code> / <code>STORE_STAFF_PASSWORD</code> 设置；未设置时随机生成并打印到服务端日志。</p>
  <h2>四步出图</h2>
  <ol>
    <li>选固定底图：女装 / 男装 / 女童 / 男童 / 婴幼儿。</li>
    <li>拖入服装平铺图，支持批量。</li>
    <li>点「一键生成」，看队列进度。</li>
    <li>下载 JPEG/PNG，或推送到商品页。长边 2048px，默认白底。</li>
  </ol>
  <h2>更换底座</h2>
  <p>「模特底座」页上传自家模特正面站姿。之后所有换衣都穿在这张底图上。</p>
</body>
</html>
