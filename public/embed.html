<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Embed</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0d11; }
      iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <script>
      var params = new URLSearchParams(location.search)
      var target = '/'
      if (params.get('store')) target = '/?store=' + encodeURIComponent(params.get('store'))
      document.write('<iframe src="' + target + '" title="Atelier Try-On"></iframe>')
    </script>
  </body>
</html>
